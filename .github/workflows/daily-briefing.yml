name: Daily briefing

on:
  schedule:
    # Backup only. The Vercel project in vercel/ starts this at 7:00 Toronto
    # time. GitHub starts its own schedule hours late, so these hourly starts
    # from midnight to noon Toronto time only matter if Vercel misses a day.
    - cron: "17 4-16 * * *"
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Follow the 7:00 to noon window and skip if today's briefing already went out. The Vercel timer sets this."
        required: false
        default: false
        type: boolean
      resend:
        description: "Saved digest to email again, such as digests/2026-10-06-manual-1027.md. Leave empty for a normal run."
        required: false
        default: ""
        type: string

# One briefing at a time, so a late run cannot race the next UTC start
# and send the same digest twice.
concurrency:
  group: daily-briefing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit that triggered a late run can predate the last delivery.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run briefing
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRIEFING_FORCE: ${{ github.event_name == 'workflow_dispatch' && !inputs.scheduled && '1' || '0' }}
          RESEND_PATH: ${{ inputs.resend }}
        run: |
          if [ -n "$RESEND_PATH" ]; then
            python -m briefing.main --resend "$RESEND_PATH"
          else
            python -m briefing.main
          fi

      - name: Commit digest and state
        if: steps.run.outcome == 'success' || steps.run.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data digests
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "digest: $(TZ=America/Toronto date +%F)"
            git push
          fi
